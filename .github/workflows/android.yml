name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test mobile editor against Core
        run: dotnet run --project src/HexManiac.Mobile.Tests/HexManiac.Mobile.Tests.csproj -c Debug
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build debug APK
        run: dotnet build src/HexManiac.Android/HexManiac.Android.csproj -c Debug -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
      - name: Prepare installable APK
        run: |
          mkdir -p apk
          apk_source=$(find . -name '*-Signed.apk' -not -path './apk/*' -print -quit)
          test -n "$apk_source"
          cp "$apk_source" apk/HexManiac-Mobile-0.3.0.apk
          python3 -c 'import zipfile; z=zipfile.ZipFile("apk/HexManiac-Mobile-0.3.0.apk"); required=["assets/resources/"+n for n in ["default.toml","tableReference.txt","pcsReference.txt","hma.py"]]; assert all(n in z.namelist() for n in required), "Missing APK reference assets"'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HexManiac-Mobile-debug
          path: "apk/HexManiac-Mobile-0.3.0.apk"
          if-no-files-found: error
