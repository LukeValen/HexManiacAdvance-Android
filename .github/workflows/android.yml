name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build debug APK
        run: dotnet build src/HexManiac.Android/HexManiac.Android.csproj -c Debug -p:AndroidPackageFormat=apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HexManiac-Mobile-debug
          path: src/HexManiac.Android/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error
